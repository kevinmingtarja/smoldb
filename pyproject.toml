[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smoldb"
version = "0.1.0"
description = "A toy SQL database backed by LMDB"
requires-python = ">=3.11"
dependencies = [
    "lmdb>=2.3.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["smoldb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
